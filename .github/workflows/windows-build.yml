name: Windows x64 Build

on:
  push:
    paths:
      - "GrowlForge_Full/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "GrowlForge_Full/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: GrowlForge_Full

    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake --preset windows-x64-release-vs2022
      - name: Build Release
        run: cmake --build --preset windows-x64-release-vs2022
      - name: Verify plug-in
        shell: pwsh
        run: |
          $plugin = "out/build/windows-x64-release-vs2022/plugins/GrowlForge.clap"
          if (-not (Test-Path $plugin)) { throw "Expected plug-in not found: $plugin" }
          Get-Item $plugin | Format-List FullName,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: GrowlForge-1.3.1-windows-x64
          path: GrowlForge_Full/out/build/windows-x64-release-vs2022/plugins/GrowlForge.clap
          if-no-files-found: error
